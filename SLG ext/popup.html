<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Grabber</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="menu">
    <div class="menu-title">SPOTIFY GRABBER</div>
    <div class="menu-line"></div>

    <!-- Now Playing Section -->
    <div class="section now-playing">
        <div class="section-title">
            <span>NOW PLAYING</span>
            <span id="volume" class="volume-inline">[VOL: 0%]</span>
        </div>
        <div id="track" class="section-text">Loading track...</div>
    </div>

    <!-- Lyrics Section -->
    <div class="section">
        <div class="section-title">Lyrics</div>
        <div id="lyrics" class="section-lyrics">Loading lyrics...</div>
    </div>

    <div class="menu-footer" datetime="2025-11-12">November 12 - (2025)</div>
</div>

<script src="popup.js"></script>
</body>
</html>
